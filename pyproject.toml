[project]
name = "raysteria-offline"
version = "0.1.0"
dependencies = [
    "litestar[standard]==2.21.0",
]
requires-python = ">=3.10,<4.0"

authors = [
    { name = "NeXoGone" },
]

description = "Re-implementation of the private API for a specific mobile gacha game."
readme = "README.md"
license = "MIT"
license-files = ["LICEN[CS]E*"]

keywords = [
    "api", "openapi", "game-server", "mobile-game", "private-server",
    "gacha", "litestar", "litestar-api", "litestar-framework"
]

classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: English",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Emulators",
    "Topic :: System :: Networking",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Games/Entertainment",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/nexogone/raysteria-offline"
Repository = "https://github.com/nexogone/raysteria-offline.git"
Discord = "https://discord.gg/VuhpKGRDhe"

[tool.ruff]
target-version = "py310"
line-length = 120
